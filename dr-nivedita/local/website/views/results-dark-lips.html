{{> inner-page-start}}

<section class="page-banner page-banner--brand">
  <div class="container">
    <h1 class="page-banner-title">Dark Lips</h1>
    <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li><a href="/">Home</a></li><li><a href="/results/">Real Results</a></li><li><span aria-current="page">Dark Lips</span></li></ol></nav>
  </div>
</section>
<section class="rcd-grid-section">
  <div class="rcd-shell">
    <div class="rcd-grid" data-rcd-grid data-lightbox-group>
      <article class="rcd-card">
        <a class="rcd-card-media" href="/images/gallery/results/dark-lips-treatment.webp" data-lightbox data-caption="Laser Treatment · Results may vary person to person."><span class="rcd-half"><img class="is-before" src="/images/gallery/results/dark-lips-treatment.webp" alt="Laser Treatment - before" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label">Before</span></span><span class="rcd-half"><img class="is-after" src="/images/gallery/results/dark-lips-treatment.webp" alt="Laser Treatment - after" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label rcd-half-label-after">After</span></span></a>
        <h3 class="rcd-card-title">Laser Treatment</h3>
      </article>
      <article class="rcd-card">
        <a class="rcd-card-media" href="/images/gallery/results/before-after-magic-blend-1.webp" data-lightbox data-caption="Alma Pixel · Results may vary person to person."><span class="rcd-half"><img class="is-before" src="/images/gallery/results/before-after-magic-blend-1.webp" alt="Alma Pixel - before" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label">Before</span></span><span class="rcd-half"><img class="is-after" src="/images/gallery/results/before-after-magic-blend-1.webp" alt="Alma Pixel - after" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label rcd-half-label-after">After</span></span></a>
        <h3 class="rcd-card-title">Alma Pixel</h3>
      </article>
    </div>
    <nav class="rcd-pagination" aria-label="Results pages" hidden></nav>
    <p class="rcd-note">* Results may vary from person to person.</p>
    <div class="rcd-back-row"><a class="rcd-back-link" href="/results/">&larr; Back to all results</a></div>
  </div>
</section>
<dialog class="video-dialog image-dialog" aria-label="Photo viewer">
  <button class="video-dialog-close" type="button" aria-label="Close photo">✕</button>
  <button class="image-dialog-nav image-dialog-prev" type="button" aria-label="Previous photo"><svg class="ico"><use href="#i-chev-l"/></svg></button>
  <button class="image-dialog-nav image-dialog-next" type="button" aria-label="Next photo"><svg class="ico"><use href="#i-chev-r"/></svg></button>
  <div class="image-dialog-frame"><img src="data:," alt=""></div>
  <p class="video-dialog-title"></p>
</dialog>

{{> contact-section}}

{{> inner-page-end}}
