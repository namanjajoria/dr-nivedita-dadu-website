{{> inner-page-start}}

<section class="page-banner page-banner--brand">
  <div class="container">
    <h1 class="page-banner-title">Bridal Dermatology</h1>
    <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li><a href="/">Home</a></li><li><a href="/results/">Real Results</a></li><li><span aria-current="page">Bridal Dermatology</span></li></ol></nav>
  </div>
</section>
<section class="rcd-grid-section">
  <div class="rcd-shell">
    <div class="rcd-grid" data-rcd-grid data-lightbox-group>
      <article class="rcd-card">
        <a class="rcd-card-media" href="/images/gallery/results/before-after-for-web-stretch-marks.webp" data-lightbox data-caption="Laser Beard Shaping"><span class="rcd-half"><img class="is-before" src="/images/gallery/results/before-after-for-web-stretch-marks.webp" alt="Laser Beard Shaping - before" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label">Before</span></span><span class="rcd-half"><img class="is-after" src="/images/gallery/results/before-after-for-web-stretch-marks.webp" alt="Laser Beard Shaping - after" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label rcd-half-label-after">After</span></span></a>
        <h3 class="rcd-card-title">Laser Beard Shaping</h3>
      </article>
      <article class="rcd-card">
        <a class="rcd-card-media" href="/images/gallery/results/laser-beard-shaping-before-after-090818.webp" data-lightbox data-caption="Laser Beard Shaping"><span class="rcd-half"><img class="is-before" src="/images/gallery/results/laser-beard-shaping-before-after-090818.webp" alt="Laser Beard Shaping - before" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label">Before</span></span><span class="rcd-half"><img class="is-after" src="/images/gallery/results/laser-beard-shaping-before-after-090818.webp" alt="Laser Beard Shaping - after" loading="lazy" width="750" height="400" decoding="async"><span class="rcd-half-label rcd-half-label-after">After</span></span></a>
        <h3 class="rcd-card-title">Laser Beard Shaping</h3>
      </article>
    </div>
    <nav class="rcd-pagination" aria-label="Results pages" hidden></nav>
    <p class="rcd-note">* Results may vary from person to person.</p>
    <div class="rcd-back-row"><a class="rcd-back-link" href="/results/">&larr; Back to all results</a></div>
  </div>
</section>
<dialog class="video-dialog image-dialog rcd-viewer" aria-label="Photo viewer">
  <button class="video-dialog-close" type="button" aria-label="Close photo">✕</button>
  <button class="image-dialog-nav image-dialog-prev" type="button" aria-label="Previous photo"><svg class="ico"><use href="#i-chev-l"/></svg></button>
  <button class="image-dialog-nav image-dialog-next" type="button" aria-label="Next photo"><svg class="ico"><use href="#i-chev-r"/></svg></button>
  <div class="rcd-viewer-pair"><span class="rcd-viewer-half"><img class="is-before" src="data:," alt=""><span class="rcd-viewer-label rcd-viewer-label-before">before</span></span><span class="rcd-viewer-half"><img class="is-after" src="data:," alt=""><span class="rcd-viewer-label rcd-viewer-label-after">after</span></span></div>
  <p class="video-dialog-title rcd-viewer-title"></p>
</dialog>

{{> contact-section}}

{{> inner-page-end}}
